rate_limit_statements:
- 1,000 brokered connections are included with the standard messaging tier (via the base charge) and can
  be shared across all queues, topics, and subscriptions within the associated Azure subscription.
- Each premium namespace can have 1, 2, or 4 messaging units
- Note that 100 brokered connections are allowed at no charge in a basic namespace (this is also the maximum
